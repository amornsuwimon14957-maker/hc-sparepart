<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบเบิก Spare Part ด้วยบาร์โค้ด</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; background: #f4f4f9; }
    .card { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
    #reader { width: 100%; border-radius: 8px; overflow: hidden; background: #000; }
    
    #scan-info-box { display: none; margin-top: 15px; padding: 15px; border: 2px solid #007bff; border-radius: 8px; background-color: #e7f3ff; }
    #scan-info-box h4 { margin: 0 0 10px 0; color: #007bff; }
    .info-label { font-weight: bold; color: #555; }
    .info-value { font-size: 1.1em; font-weight: bold; color: #000; }
    .info-qty { color: #28a745; font-size: 1.3em; }

    input, button { width: 100%; padding: 12px; margin-top: 10px; box-sizing: border-box; border-radius: 4px; border: 1px solid #ccc; font-size: 1em; }
    button { background: #007bff; color: white; border: none; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #0056b3; }

    .btn-add { background: #28a745; margin-top: 20px;}
    .btn-add:hover { background: #218838; }
    
    #result { padding: 12px; border-radius: 4px; margin-top: 15px; display: none; font-weight: bold; text-align: center;}
    .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 0.9em; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
    th { background-color: #f2f2f2; }
    .table-container { max-height: 300px; overflow-y: auto; border: 1px solid #ddd; border-radius: 4px;}
  </style>
</head>
<body>

  <div class="card">
    <h2>สแกนบาร์โค้ดเพื่อเบิกอะไหล่</h2>
    <div id="reader"></div>
    
    <div id="scan-info-box">
      <h4>🔍 พบข้อมูลอะไหล่:</h4>
      <p><span class="info-label">ชื่ออะไหล่:</span> <span id="info-name" class="info-value">-</span></p>
      <p><span class="info-label">จำนวนคงเหลือปัจจุบัน:</span> <span id="info-qty" class="info-value info-qty">-</span> ชิ้น</p>
      <input type="hidden" id="barcode">
    </div>

    <div id="interaction-area" style="display:none;">
      <label style="margin-top:15px; display:block; font-weight:bold;">จำนวนที่ต้องการเบิก:</label>
      <input type="number" id="amount" value="1" min="1">
      <button id="btn-withdraw" onclick="withdrawPart()">ยืนยันการตัดยอดเบิก</button>
    </div>
    
    <div id="result"></div>
  </div>

  <div class="card">
    <h3>ตารางรายการอะไหล่ในสต็อก</h3>
    <div class="table-container">
      <table id="stockTable">
        <thead>
          <tr>
            <th>Barcode</th>
            <th>ชื่ออะไหล่</th>
            <th>คงเหลือ</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
    <button class="btn-add" onclick="showAddSection()">+ เพิ่มอะไหล่ใหม่ / เติมสต็อก</button>
    
    <div id="add-section" style="display:none; margin-top:20px; padding-top:20px; border-top:1px solid #eee;">
      <h4>เพิ่ม/ปรับปรุงสต็อก</h4>
      <input type="text" id="add_barcode" placeholder="Barcode">
      <input type="text" id="add_name" placeholder="ชื่ออะไหล่">
      <input type="number" id="add_qty" placeholder="จำนวนที่นำเข้า" value="10">
      <button class="btn-add" style="margin-top:10px;" onclick="addPart()">บันทึกข้อมูลเข้าสต็อก</button>
    </div>
  </div>

  <script>
    // กำหนดรหัสบาร์โค้ดเริ่มต้นที่ชัดเจน ไม่ซ้ำกัน
    const defaultData = {
      "https://i.postimg.cc/NfNVZB7C/barcode.gif": { name: "หางปลา 50 sq.mm.", quantity: 10 },
      "LUG-100": { name: "หางปลา 100 sq.mm.", quantity: 10 }
    };

    function getParts() {
      const stored = localStorage.getItem('spare_parts_v2'); // รีเซ็ตเพื่อดึงค่าเริ่มต้นใหม่
      if (!stored) {
        localStorage.setItem('spare_parts_v2', JSON.stringify(defaultData));
        return defaultData;
      }
      return JSON.parse(stored);
    }

    function saveParts(parts) {
      localStorage.setItem('spare_parts_v2', JSON.stringify(parts));
      renderTable();
    }

    const html5QrCode = new Html5Qrcode("reader");
    const config = { fps: 15, qrbox: { width: 250, height: 150 } };

    html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess)
    .catch(err => {
      console.error("Camera access error:", err);
      document.getElementById('interaction-area').style.display = 'block';
      document.getElementById('barcode').type = 'text';
      document.getElementById('barcode').placeholder = 'พิมพ์บาร์โค้ดเองที่นี่เพื่อทดสอบ';
    });

    function onScanSuccess(decodedText) {
      const parts = getParts();
      const infoBox = document.getElementById('scan-info-box');
      const interactArea = document.getElementById('interaction-area');
      const resultBox = document.getElementById('result');

      resultBox.style.display = 'none';
      document.getElementById('barcode').value = decodedText;

      if (parts[decodedText]) {
        document.getElementById('info-name').innerText = parts[decodedText].name;
        document.getElementById('info-qty').innerText = parts[decodedText].quantity;
        
        infoBox.style.display = 'block';
        interactArea.style.display = 'block';
        interactArea.scrollIntoView({ behavior: 'smooth' });
      } else {
        infoBox.style.display = 'none';
        interactArea.style.display = 'none';
        showResult(`🚫 ไม่พบรหัสบาร์โค้ด: "${decodedText}" ในระบบ`, false);
      }
    }

    function withdrawPart() {
      const barcode = document.getElementById('barcode').value.trim();
      const amountInput = document.getElementById('amount');
      const amount = parseInt(amountInput.value, 10);
      
      if (!barcode || isNaN(amount) || amount <= 0) {
        return showResult('⚠️ กรุณาระบุจำนวนที่ต้องการเบิกให้ถูกต้อง', false);
      }

      let parts = getParts();
      const part = parts[barcode];

      if (!part) {
        return showResult('🚫 เกิดข้อผิดพลาด ไม่พบข้อมูลอะไหล่', false);
      }

      if (part.quantity < amount) {
        return showResult(`❌ สต็อกไม่พอ! มีอยู่ ${part.quantity} ต้องการเบิก ${amount}`, false);
      }

      part.quantity -= amount;
      const newQty = part.quantity;

      saveParts(parts);

      showResult(`✅ เบิกสำเร็จ! ${part.name} จำนวน ${amount} ชิ้น<br>คงเหลือใหม่: ${newQty} ชิ้น`, true);
      document.getElementById('info-qty').innerText = newQty;
      amountInput.value = 1;
    }

    function addPart() {
      const barcode = document.getElementById('add_barcode').value.trim();
      const name = document.getElementById('add_name').value.trim();
      const qtyInput = document.getElementById('add_qty');
      const qty = parseInt(qtyInput.value, 10);

      if (!barcode || !name || isNaN(qty)) {
        return alert('⚠️ กรุณากรอกข้อมูลให้ครบถ้วน');
      }

      let parts = getParts();
      if (parts[barcode]) {
        parts[barcode].quantity += qty;
        parts[barcode].name = name;
      } else {
        parts[barcode] = { name: name, quantity: qty };
      }

      saveParts(parts);
      alert(`✅ บันทึกสต็อกสำเร็จ: ${name}`);
      
      document.getElementById('add_barcode').value = '';
      document.getElementById('add_name').value = '';
      qtyInput.value = '10';
    }

    function showAddSection() {
      const section = document.getElementById('add-section');
      section.style.display = section.style.display === 'none' ? 'block' : 'none';
    }

    function showResult(msg, isSuccess) {
      const box = document.getElementById('result');
      box.style.display = 'block';
      box.className = isSuccess ? 'success' : 'error';
      box.innerHTML = msg;
    }

    function renderTable() {
      const parts = getParts();
      const tbody = document.querySelector('#stockTable tbody');
      tbody.innerHTML = '';
      
      const sortedKeys = Object.keys(parts).sort();

      for (let code of sortedKeys) {
        const tr = document.createElement('tr');
        const displayCode = code.length > 20 ? code.substring(0, 17) + '...' : code;
        tr.innerHTML = `<td title="${code}">${displayCode}</td><td>${parts[code].name}</td><td>${parts[code].quantity}</td>`;
        tbody.appendChild(tr);
      }
    }

    renderTable();
  </script>
</body>
</html>
